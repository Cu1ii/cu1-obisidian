services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    container_name: infra-es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "0.0.0.0:9200:9200"
      - "0.0.0.0:9300:9300"
    volumes:
      - ${SERVER_ROOT:?need SERVER_ROOT in .env}/infra/es/data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - infra-net

networks:
  infra-net:
    external: true
